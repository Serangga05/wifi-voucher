<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login User</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>
<body class="auth-body">

<!-- LOADING -->
<div class="loading-overlay" id="loading-screen">

    <div class="spinner"></div>

</div>

<section class="auth-section">

    <div class="container">

        <div class="row align-items-center justify-content-center min-vh-100">

            <!-- LEFT -->
            <div class="col-lg-6 d-none d-lg-block">

                <div class="auth-left">

                    <div class="hero-badge">

                        <i class="fa-solid fa-wifi"></i>
                        Internet Cepat & Stabil

                    </div>

                    <h1 class="auth-title">

                        Login Untuk
                        <span>Mulai Akses WiFi</span>

                    </h1>

                    <p class="auth-subtitle">

                        Nikmati pembelian voucher hotspot
                        otomatis dengan sistem modern,
                        cepat, aman, dan profesional.

                    </p>

                    <img
                        src="https://cdn-icons-png.flaticon.com/512/1183/1183657.png"
                        class="hero-image"
                    >

                </div>

            </div>

            <!-- RIGHT -->
            <div class="col-lg-5 col-md-8">

                <div class="auth-card">

                    <div class="text-center mb-4">

                        <div class="auth-icon">

                            <i class="fa-solid fa-user"></i>

                        </div>

                        <h2 class="fw-bold mt-3">

                            Login User

                        </h2>

                        <p class="text-muted">

                            Masuk untuk membeli voucher hotspot.

                        </p>

                    </div>

                    <form method="POST" id="loginForm">

                        <!-- WHATSAPP -->
                        <div class="input-group custom-input mb-3">

                            <span class="input-group-text">

                                <i class="fa-brands fa-whatsapp"></i>

                            </span>

                            <input
                                type="text"
                                name="whatsapp"
                                placeholder="Nomor WhatsApp"
                                class="form-control"
                                required
                            >

                        </div>

                        <!-- PASSWORD -->
                        <div class="input-group custom-input mb-4">

                            <span class="input-group-text">

                                <i class="fa-solid fa-lock"></i>

                            </span>

                            <input
                                type="password"
                                name="password"
                                id="password"
                                placeholder="Password"
                                class="form-control"
                                required
                            >

                            <button
                                type="button"
                                class="btn btn-light border"
                                id="togglePassword">

                                <i class="fa-solid fa-eye"></i>

                            </button>

                        </div>

                        <!-- BUTTON -->
                        <button
                            type="submit"
                            class="btn btn-custom auth-btn w-100">

                            <i class="fa-solid fa-right-to-bracket"></i>
                            Login Sekarang

                        </button>

                    </form>

                    <div class="text-center mt-4">

                        <span class="text-muted">

                            Belum punya akun?

                        </span>

                        <a href="/register"
                           class="register-link">

                            Register

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

<script>

window.addEventListener('load', function(){

    document.getElementById('loading-screen')
    .style.display = 'none';

});

const togglePassword =
document.getElementById('togglePassword');

const password =
document.getElementById('password');

togglePassword.addEventListener('click', function(){

    const type =
    password.getAttribute('type') === 'password'
    ? 'text'
    : 'password';

    password.setAttribute('type', type);

    this.innerHTML =
    type === 'password'
    ? '<i class="fa-solid fa-eye"></i>'
    : '<i class="fa-solid fa-eye-slash"></i>';

});

</script>

</body>
</html>
