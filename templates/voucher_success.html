<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Voucher Berhasil</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>
<body class="success-page-body">

<!-- LOADING -->
<div class="loading-overlay"
     id="loading-screen">

    <div class="spinner"></div>

</div>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark premium-navbar">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="/">

            <i class="fa-solid fa-wifi"></i>
            WiFi Voucher

        </a>

        <a href="/"
           class="btn btn-light nav-btn">

            <i class="fa-solid fa-house"></i>
            Home

        </a>

    </div>

</nav>

<!-- SUCCESS -->
<section class="success-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-7">

                <div class="success-card">

                    <!-- ICON -->
                    <div class="success-icon-wrapper">

                        <div class="success-icon-circle">

                            <i class="fa-solid fa-check"></i>

                        </div>

                    </div>

                    <!-- TITLE -->
                    <div class="text-center">

                        <h1 class="success-title">

                            Pembayaran Berhasil

                        </h1>

                        <p class="success-subtitle">

                            Voucher hotspot Anda berhasil dibuat
                            dan siap digunakan.

                        </p>

                    </div>

                    <!-- USERNAME -->
                    <div class="voucher-info-box">

                        <div class="voucher-top">

                            <div>

                                <small class="voucher-label">

                                    Username Voucher

                                </small>

                                <h3 id="usernameText"
                                    class="voucher-value">

                                    {{ voucher.username }}

                                </h3>

                            </div>

                            <button
                                class="copy-btn"

                                onclick="copyUsername()">

                                <i class="fa-solid fa-copy"></i>

                            </button>

                        </div>

                    </div>

                    <!-- PASSWORD -->
                    <div class="voucher-info-box">

                        <div class="voucher-top">

                            <div>

                                <small class="voucher-label">

                                    Password Voucher

                                </small>

                                <h3 id="passwordText"
                                    class="voucher-value">

                                    {{ voucher.password }}

                                </h3>

                            </div>

                            <button
                                class="copy-btn"

                                onclick="copyPassword()">

                                <i class="fa-solid fa-copy"></i>

                            </button>

                        </div>

                    </div>

                    <!-- ALERT -->
                    <div class="success-note">

                        <i class="fa-solid fa-circle-info"></i>

                        Simpan username dan password voucher Anda.
                        Jangan dibagikan kepada orang lain.

                    </div>

                    <!-- BUTTON -->
                    <div class="mt-4">

                        <a href="/dashboard"
                           class="btn btn-success-page w-100">

                            <i class="fa-solid fa-house"></i>
                            Kembali ke Dashboard

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

<!-- SWEET ALERT -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- SCRIPT -->
<script>

window.addEventListener('load', function(){

    document
    .getElementById('loading-screen')
    .style.display = 'none';

});

function copyUsername(){

    let text =
    document.getElementById(
        "usernameText"
    ).innerText;

    navigator.clipboard.writeText(text);

    Swal.fire({

        icon:'success',

        title:'Berhasil',

        text:'Username berhasil dicopy',

        timer:1500,

        showConfirmButton:false
    });
}

function copyPassword(){

    let text =
    document.getElementById(
        "passwordText"
    ).innerText;

    navigator.clipboard.writeText(text);

    Swal.fire({

        icon:'success',

        title:'Berhasil',

        text:'Password berhasil dicopy',

        timer:1500,

        showConfirmButton:false
    });
}

</script>

</body>
</html>
