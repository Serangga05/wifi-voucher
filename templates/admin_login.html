<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <style>

        body{

            background:
            linear-gradient(
                rgba(255,255,255,0.82),
                rgba(255,255,255,0.82)
            ),

            url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=2070');

            background-size:cover;
            background-position:center;
            background-attachment:fixed;

            min-height:100vh;
        }

        .login-card{

            background:rgba(255,255,255,0.78);

            backdrop-filter:blur(12px);

            border-radius:30px;

            border:1px solid rgba(255,255,255,0.4);

            box-shadow:
            0 15px 40px rgba(0,0,0,0.1);

            animation:fadeUp 0.7s ease;
        }

        @keyframes fadeUp{

            from{

                opacity:0;
                transform:translateY(40px);
            }

            to{

                opacity:1;
                transform:translateY(0);
            }
        }

        .login-title{

            font-size:42px;
            font-weight:800;
            color:#0f172a;
        }

        .login-subtitle{

            color:#64748b;
        }

        .form-control{

            height:58px;

            border-radius:16px;

            border:none;

            background:#f1f5f9;

            font-size:17px;
        }

        .form-control:focus{

            box-shadow:none;

            border:2px solid #2563eb;
            background:white;
        }

        .login-btn{

            height:58px;

            border:none;

            border-radius:16px;

            background:linear-gradient(
                135deg,
                #2563eb,
                #1d4ed8
            );

            color:white;

            font-size:18px;
            font-weight:700;

            transition:0.3s;
        }

        .login-btn:hover{

            transform:translateY(-3px);

            box-shadow:
            0 10px 25px rgba(37,99,235,0.3);
        }

        .password-wrapper{

            position:relative;
        }

        .toggle-password{

            position:absolute;

            top:50%;
            right:18px;

            transform:translateY(-50%);

            cursor:pointer;

            color:#64748b;

            font-size:20px;
        }

        .admin-icon{

            width:100px;
            height:100px;

            border-radius:50%;

            background:linear-gradient(
                135deg,
                #2563eb,
                #1d4ed8
            );

            display:flex;
            align-items:center;
            justify-content:center;

            margin:auto;

            margin-bottom:25px;

            color:white;

            font-size:45px;

            box-shadow:
            0 10px 25px rgba(37,99,235,0.3);
        }

        .loading-spinner{

            display:none;

            width:22px;
            height:22px;

            border:3px solid rgba(255,255,255,0.3);

            border-top:3px solid white;

            border-radius:50%;

            animation:spin 1s linear infinite;
        }

        @keyframes spin{

            100%{

                transform:rotate(360deg);
            }
        }

    </style>

</head>
<body>

<section class="min-vh-100 d-flex align-items-center">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-5 col-md-7">

                <div class="login-card p-5">

                    <!-- ICON -->
                    <div class="admin-icon">

                        <i class="bi bi-shield-lock-fill"></i>

                    </div>

                    <!-- TITLE -->
                    <div class="text-center mb-4">

                        <h1 class="login-title">

                            Admin Login

                        </h1>

                        <p class="login-subtitle">

                            Masuk ke dashboard admin hotspot.

                        </p>

                    </div>

                    <!-- FORM -->
                    <form method="POST"
                          id="loginForm">

                        <!-- USERNAME -->
                        <div class="mb-4">

                            <input
                                type="text"
                                name="whatsapp"
                                placeholder="Username Admin"
                                class="form-control"
                                required
                            >

                        </div>

                        <!-- PASSWORD -->
                        <div class="mb-4 password-wrapper">

                            <input
                                type="password"
                                name="password"
                                id="password"
                                placeholder="Password"
                                class="form-control"
                                required
                            >

                            <i
                                class="bi bi-eye-slash toggle-password"
                                id="togglePassword">

                            </i>

                        </div>

                        <!-- BUTTON -->
                        <button
                            type="submit"
                            class="login-btn w-100 d-flex justify-content-center align-items-center gap-2"
                            id="loginButton">

                            <span id="loginText">

                                Login

                            </span>

                            <div class="loading-spinner"
                                 id="loadingSpinner">

                            </div>

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>

<script>

const togglePassword =
document.getElementById('togglePassword');

const password =
document.getElementById('password');

togglePassword.addEventListener('click', function(){

    const type =
    password.getAttribute('type') === 'password'
    ? 'text'
    : 'password';

    password.setAttribute('type', type);

    this.classList.toggle('bi-eye');

    this.classList.toggle('bi-eye-slash');
});

document
.getElementById('loginForm')
.addEventListener('submit', function(){

    document
    .getElementById('loginText')
    .innerHTML = 'Loading...';

    document
    .getElementById('loadingSpinner')
    .style.display = 'block';
});

</script>

</body>
</html>
