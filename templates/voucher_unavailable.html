<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Voucher Habis</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>
<body>

<section class="min-vh-100 d-flex align-items-center justify-content-center"
         style="background:linear-gradient(135deg,#eff6ff,#ffffff);">

    <div class="card shadow-lg border-0 rounded-4"
         style="max-width:520px;width:100%;">

        <div class="card-body text-center p-5">

            <div class="mb-4"
                 style="font-size:80px;color:#ef4444;">

                <i class="bi bi-wifi-off"></i>

            </div>

            <h2 class="fw-bold mb-3">

                Voucher Tidak Tersedia

            </h2>

            <p class="text-muted mb-4">

                Maaf, voucher untuk paket ini sedang habis
                atau sedang dipesan oleh pengguna lain.

            </p>

            <a href="/"
               class="btn btn-primary btn-lg w-100 mb-3">

                <i class="bi bi-house-fill"></i>
                Kembali ke Beranda

            </a>

            <a href="javascript:history.back()"
               class="btn btn-light btn-lg w-100">

                Coba Paket Lain

            </a>

        </div>

    </div>

</section>

</body>
</html>
